<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <title>%VITE_HOME_TITLE%</title>
    <meta name="description" content="%VITE_HOME_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_HOME_TITLE%" />
    <meta property="og:description" content="%VITE_HOME_DESCRIPTION%" />
    <script>
      // Blocking & inline (bukan type="module") supaya jalan SEBELUM paint pertama --
      // menghindari kedipan tema salah pas halaman baru dibuka.
      (function () {
        try {
          var t = localStorage.getItem('kuma_status_theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
