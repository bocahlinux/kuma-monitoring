# DNS docker internal, dipakai supaya nginx resolve "kuma-status-backend" ulang tiap
# request (bukan cuma sekali pas nginx start) -- menghindari race kalau backend belum
# siap sesaat setelah container ini nyala.
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy CUMA ke endpoint publik status page (GET /api/status-pages/:slug), sengaja
    # dibatasi dengan regex + limit_except supaya endpoint admin backend (POST/PUT/DELETE,
    # /api/monitors mentah, dll) tetap TIDAK bisa dijangkau dari luar sama sekali --
    # backend nggak pernah punya hostname publik sendiri.
    location ~ ^/api/status-pages/[^/]+$ {
        limit_except GET {
            deny all;
        }
        set $backend_upstream http://kuma-status-backend:4000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
