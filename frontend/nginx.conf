# DNS docker internal, dipakai supaya nginx resolve "kuma-status-backend" ulang tiap
# request (bukan cuma sekali pas nginx start) -- menghindari race kalau backend belum
# siap sesaat setelah container ini nyala.
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy semua /api/* ke backend lewat docker network internal. Backend TETAP tidak
    # punya hostname publik sendiri -- ini cuma "kabel" internal, proteksinya tetap di
    # backend: GET /api/status-pages/:slug publik (dipakai status page), selain itu wajib
    # header x-api-key (dipakai halaman /admin). Salah/tanpa key = 401 dari backend.
    location /api/ {
        set $backend_upstream http://kuma-status-backend:4000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
