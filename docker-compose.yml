name: kuma-monitoring

services:

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - UPTIME_KUMA_DB_TYPE=mariadb
      - UPTIME_KUMA_DB_HOSTNAME=mariadb
      - UPTIME_KUMA_DB_PORT=3306
      - UPTIME_KUMA_DB_NAME=${MYSQL_DATABASE}
      - UPTIME_KUMA_DB_USERNAME=${MYSQL_USER}
      - UPTIME_KUMA_DB_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "100.83.41.88:3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      - monitoring-network
    depends_on:
      - mariadb
    mem_limit: 300m
    mem_reservation: 128m

  mariadb:
    image: mariadb:11
    container_name: monitoring-mariadb
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=64M
      - --innodb-log-file-size=16M
      - --performance-schema=OFF
    environment:
      - TZ=${TZ}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mariadb:/var/lib/mysql
    networks:
      - monitoring-network
    mem_limit: 256m
    mem_reservation: 128m

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: monitoring-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - monitoring-network
    mem_limit: 64m
    mem_reservation: 32m

  kuma-status-backend:
    build:
      context: ./kuma-status-backend
    container_name: kuma-status-backend
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PORT=4000
      - KUMA_BASE_URL=http://uptime-kuma:3001
      - KUMA_USERNAME=${KUMA_USERNAME}
      - KUMA_PASSWORD=${KUMA_PASSWORD}
      - API_KEY=${API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DB_PATH=/app/data/app.db
    volumes:
      - ./data/kuma-status-backend:/app/data
    networks:
      - monitoring-network
    depends_on:
      - uptime-kuma
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - "100.83.41.88:4000:4000"
    # Cuma di-bind ke IP Tailscale (100.83.41.88), bukan ke semua interface -- jadi
    # nggak nambah paparan ke internet publik, cuma buat kamu akses langsung/testing
    # lewat Tailscale. Endpoint publik (status page) tetap lewat cloudflared -> frontend
    # -> nginx proxy seperti biasa; endpoint admin di sini tetap wajib x-api-key.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL}
        VITE_HOME_TITLE: ${FRONTEND_HOME_TITLE:-Status Layanan}
        VITE_HOME_DESCRIPTION: ${FRONTEND_HOME_DESCRIPTION:-Status realtime layanan kami}
        VITE_POLL_INTERVAL_MS: ${FRONTEND_POLL_INTERVAL_MS:-20000}
        VITE_UPTIME_PERIOD_KEY: ${FRONTEND_UPTIME_PERIOD_KEY:-24}
        VITE_HEADLINE_PERIOD_KEY: ${FRONTEND_HEADLINE_PERIOD_KEY:-720}
        VITE_HEADLINE_PERIOD_LABEL: ${FRONTEND_HEADLINE_PERIOD_LABEL:-30 hari}
    container_name: kuma-status-frontend
    restart: unless-stopped
    networks:
      - monitoring-network
    depends_on:
      - kuma-status-backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 32m
    mem_reservation: 16m
    # Sama kayak backend: tanpa "ports:", diakses lewat cloudflared tunnel saja.
    # NOTE: VITE_* di atas di-bake ke file statis SAAT BUILD, bukan runtime -- kalau
    # ganti FRONTEND_API_BASE_URL/slug/dll di .env, wajib rebuild ulang image-nya
    # ("docker compose up -d --build frontend"), bukan cukup restart.

networks:
  monitoring-network:
    name: monitoring-network
    driver: bridge
